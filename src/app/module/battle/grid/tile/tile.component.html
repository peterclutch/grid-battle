@if (entities()[0]; as occupant) {
    <span
            class="entity"
            [class.player]="occupant.kind === 'character' && occupant.team == 'blue'"
            [class.enemy]="occupant.kind === 'character' && occupant.team === 'red'"
            [class.projectile]="occupant.kind === 'projectile'"
            [attr.data-direction]="occupant.kind === 'projectile' ? occupant.direction : null"
    ></span>
}
